name: Build Dispute Client Android (Mojo ARM64) Port

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android-mojo:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare clean Dispute Client v2.0.3 upstream JAR
        run: |
          python3 tools/prepare_upstream_jar.py
          cat build/upstream/paths.env >> "$GITHUB_ENV"

      - name: Fetch MC 1.21.11 intermediary + Fabric + Mixin + ASM compile classpath
        run: |
          python3 tools/fetch_mc_compile_classpath.py

      - name: Compile CorzBytecodePatcher and lower QVM + Android patches on v2.0.3 bytecode
        run: |
          mkdir -p build/tools-classes build/patched build/reports
          ASM_CP="$(cat build/deps/asm_classpath.txt)"
          javac --release 21 -cp "$ASM_CP" -d build/tools-classes tools/CorzBytecodePatcher.java
          java -cp "build/tools-classes:$ASM_CP" CorzBytecodePatcher \
            "$UPSTREAM_MOD_JAR" \
            build/patched/corzclient-asm-patched.jar \
            build/reports/asm_patch_report.txt

      - name: Compile Android compat classes, pure-Java QVM stub, CorzClient, and 2.0.3 Mixins
        run: |
          mkdir -p build/mod-classes build/compile-sources
          MC_CP="$(cat build/deps/compile_classpath.txt)"
          FULL_CP="build/patched/corzclient-asm-patched.jar:libs/client-rpc-1.0.0-bundled.jar:$MC_CP"

          printf '%s\n' \
            source/com/corz/client/android/AndroidFilePicker.java \
            source/com/corz/client/android/AndroidRuntimeEnv.java \
            source/com/corz/client/android/CompatFileDialog.java \
            source/com/corz/client/android/MojoBlurCoordinator.java \
            source/com/corz/client/android/MojoInputBridge.java \
            source/com/corz/client/qvm/Runtime.java \
            source/com/corz/client/LocalBranding.java \
            source/com/corz/client/CorzClient.java \
            source/com/corz/client/mixins/MixinWindow.java \
            source/com/corz/client/mixins/MixinMouse.java \
            source/com/corz/client/mixins/MixinKeyboard.java \
            source/com/corz/client/mixins/MixinGameRenderer.java \
            source/com/corz/client/mixins/MixinGameRendererMotionBlur.java \
            source/com/corz/client/mixins/MixinHeldItemRenderer.java \
            source/com/corz/client/mixins/MixinGameMenuScreenDispute.java \
            > build/compile-sources/sources.txt
          echo "Compiling $(wc -l < build/compile-sources/sources.txt) Java files against MC 1.21.11 intermediary + v2.0.3 gg.corz..."

          javac --release 21 -encoding UTF-8 -Xlint:none -proc:none -cp "$FULL_CP" -d build/mod-classes @build/compile-sources/sources.txt

      - name: Assemble & verify final DisputeClient-2.0.3-Android-Mojo JAR
        run: |
          python3 tools/overlay_and_verify_jar.py \
            --asm-jar build/patched/corzclient-asm-patched.jar \
            --compiled-classes build/mod-classes \
            --shaders-dir source/assets/corzclient/shaders \
            --rpc-jar libs/client-rpc-1.0.0-bundled.jar \
            --source-dir source \
            --output-jar build/dist/DisputeClient-2.0.3-Android-Mojo.jar \
            --report build/reports/jar_verification_report.txt

          cp build/dist/DisputeClient-2.0.3-Android-Mojo.jar build/dist/CorzClient-2.0.3-Android-Mojo.jar

      - name: Upload built JAR & verification reports
        uses: actions/upload-artifact@v4
        with:
          name: DisputeClient-2.0.3-Android-Mojo
          path: |
            build/dist/*.jar
            build/reports/*.txt
          if-no-files-found: error
